name: SEO Preview

on:
  push:
    branches:
      - seo/phase-2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seo-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate real homepage
        run: |
          set -e
          size=$(wc -c < public/index.html)
          echo "public/index.html size: ${size} bytes"
          test "$size" -gt 100000
          grep -q '<head' public/index.html
          grep -q '</head>' public/index.html
          grep -q '<body' public/index.html
          grep -q '</body>' public/index.html
          grep -q '</html>' public/index.html
          grep -q '<title>' public/index.html
          grep -q 'rel="canonical"' public/index.html

      - name: Prepare real website preview
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -a public/. _site/
          test -s _site/index.html
          test "$(wc -c < _site/index.html)" -gt 100000
          test -f _site/robots.txt || true
          test -f _site/sitemap.xml || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
