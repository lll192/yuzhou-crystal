services:
  web:
    build: .
    container_name: yuzhou-inquiry
    restart: unless-stopped
    # 生产建议：用 Cloudflare 代理 + 源站证书，并在 VPS 防火墙只放行 22/80/443，
    # 仅允许 Cloudflare 回源 IP 段访问 3000（或改用 Cloudflare Tunnel 彻底不暴露 3000）。
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
