services:
  web-preview:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: yuzhou-crystal-preview
    restart: unless-stopped
    ports:
      - "${PREVIEW_PORT:-3001}:3000"
    environment:
      - NODE_ENV=preview
      - PORT=3000
      - DATA_DIR=/app/preview-data
      - ADMIN_TOKEN=${PREVIEW_ADMIN_TOKEN:-preview-change-me}
      - SESSION_SECRET=${PREVIEW_SESSION_SECRET:-preview-session-change-me}
    volumes:
      - ../preview-data:/app/preview-data
      - ../preview-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
